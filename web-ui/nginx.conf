server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Re-resolve the backend per request via Docker's embedded DNS, so a
    # recreated source-changer container (new IP) never leaves the UI with
    # stale 502s. Without this, nginx resolves the hostname once at startup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://source-changer:8100;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws {
        set $backend_ws http://source-changer:8100;
        proxy_pass $backend_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
